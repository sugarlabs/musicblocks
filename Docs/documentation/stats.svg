<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="938.4519"
   height="581.73077"
   viewBox="0 0 938.4519 581.73077"
   version="1.1"
   id="svg_stats"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .window-frame { fill: #d4d4d4; stroke: #505050; stroke-width: 2; }
      .window-header { fill: #b8b8b8; stroke: #505050; stroke-width: 1.5; }
      .header-title { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 20px; fill: #404040; font-weight: 600; letter-spacing: 2px; }
      .header-btn { fill: #999999; stroke: #404040; stroke-width: 1.5; cursor: pointer; }
      .header-btn-text { font-family: sans-serif; font-size: 16px; fill: #ffffff; font-weight: bold; }
      .toolbar-box { fill: #80c0ff; stroke: #3080d0; stroke-width: 1.5; }
      .stats-text { font-family: 'Courier New', Courier, monospace, sans-serif; font-size: 19px; fill: #111111; line-height: 1.4; }
      .chart-axis { stroke: #aaaaaa; stroke-width: 1; stroke-dasharray: 3,3; }
      .chart-grid { stroke: #cccccc; stroke-width: 1; fill: none; }
      .chart-poly { fill: rgba(100, 160, 240, 0.35); stroke: #2070d0; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Outer Background Container -->
  <rect x="0" y="0" width="938.4519" height="581.73077" fill="#ffffff" rx="8" ry="8"/>

  <!-- Main Floating Widget Window -->
  <g id="stats_window" transform="translate(140, 20)">
    <!-- Window Outer Frame -->
    <rect class="window-frame" x="0" y="0" width="658" height="540" rx="4" ry="4" />
    
    <!-- Window Top Header Bar -->
    <rect class="window-header" x="0" y="0" width="658" height="38" rx="4" ry="4" />
    <rect class="window-header" x="0" y="20" width="658" height="18" />

    <!-- Window Title -->
    <text x="329" y="26" class="header-title" text-anchor="middle">STATS</text>

    <!-- Header Action Buttons (Close, Maximize, Minimize) -->
    <!-- Close Button (Left side of header) -->
    <rect class="header-btn" x="8" y="7" width="24" height="24" rx="2" />
    <path d="M 13,12 L 27,26 M 27,12 L 13,26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Maximize Button (Right side of header) -->
    <rect class="header-btn" x="592" y="7" width="24" height="24" rx="2" />
    <path d="M 596,11 H 612 V 27 H 596 Z M 600,15 H 608 V 23 H 600 Z" fill="#ffffff" />

    <!-- Minimize Button (Right side of header) -->
    <rect class="header-btn" x="622" y="7" width="24" height="24" rx="2" />
    <rect x="626" y="21" width="16" height="4" fill="#ffffff" />

    <!-- Window Body Area -->
    <g transform="translate(0, 38)">
      
      <!-- Toolbar Button Area (NEW Refresh Button reload.svg) -->
      <g transform="translate(10, 10)">
        <rect class="toolbar-box" x="0" y="0" width="48" height="48" rx="4" />
        <!-- Refresh Icon reload.svg -->
        <g transform="translate(10, 10) scale(1.4)">
          <path d="M 10,2 A 8,8 0 1,1 3.5,6" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" />
          <polygon points="10,0 10,6 15,2" fill="#000000" />
        </g>
      </g>

      <!-- Statistical Data Text List -->
      <g transform="translate(80, 20)">
        <text class="stats-text" x="0" y="20">• duples: 1</text>
        <text class="stats-text" x="0" y="44">• triplets: 0</text>
        <text class="stats-text" x="0" y="68">• quintuplets: 0</text>
        <text class="stats-text" x="0" y="92">• pitch names: G, E</text>
        <text class="stats-text" x="0" y="116">• number of notes: 3</text>
        <text class="stats-text" x="0" y="140">• lowest note: E4, 330Hz</text>
        <text class="stats-text" x="0" y="164">• highest note: G4, 392Hz</text>
        <text class="stats-text" x="0" y="188">• rests used: 0</text>
        <text class="stats-text" x="0" y="212">• ornaments used: 0</text>
      </g>

      <!-- 2D Radar Chart Visualization -->
      <g transform="translate(329, 360)">
        <!-- Outer Concentric Polygon Rings -->
        <polygon class="chart-grid" points="0,-100 70.7,-70.7 100,0 70.7,70.7 0,100 -70.7,70.7 -100,0 -70.7,-70.7" />
        <polygon class="chart-grid" points="0,-70 49.5,-49.5 70,0 49.5,49.5 0,70 -49.5,49.5 -70,0 -49.5,-49.5" />
        <polygon class="chart-grid" points="0,-40 28.3,-28.3 40,0 28.3,28.3 0,40 -28.3,28.3 -40,0 -28.3,-28.3" />

        <!-- Axis Lines -->
        <line class="chart-axis" x1="0" y1="-110" x2="0" y2="110" />
        <line class="chart-axis" x1="-110" y1="0" x2="110" y2="0" />
        <line class="chart-axis" x1="-77.8" y1="-77.8" x2="77.8" y2="77.8" />
        <line class="chart-axis" x1="-77.8" y1="77.8" x2="77.8" y2="-77.8" />

        <!-- Filled Data Polygon -->
        <polygon class="chart-poly" points="0,-75 50,-35 85,0 45,55 0,60 -60,40 -70,0 -50,-50" />

        <!-- Axis Labels -->
        <text font-family="sans-serif" font-size="11" fill="#666666" text-anchor="middle" x="0" y="-115">rhythm</text>
        <text font-family="sans-serif" font-size="11" fill="#666666" text-anchor="start" x="85" y="-80">pitch</text>
        <text font-family="sans-serif" font-size="11" fill="#666666" text-anchor="start" x="115" y="4">tone</text>
        <text font-family="sans-serif" font-size="11" fill="#666666" text-anchor="start" x="85" y="88">mouse</text>
        <text font-family="sans-serif" font-size="11" fill="#666666" text-anchor="middle" x="0" y="125">pen</text>
        <text font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end" x="-85" y="88">number</text>
        <text font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end" x="-115" y="4">flow</text>
        <text font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end" x="-85" y="-80">action</text>
      </g>

    </g>
  </g>
</svg>
