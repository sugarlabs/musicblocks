<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="938.4519"
   height="581.73077"
   viewBox="0 0 938.4519 581.73077"
   version="1.1"
   id="svg_stats"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .window-frame { fill: #d4d4d4; stroke: #505050; stroke-width: 2; }
      .window-header { fill: #b8b8b8; stroke: #505050; stroke-width: 1.5; }
      .header-title { font-family: sans-serif; font-size: 20px; fill: #404040; font-weight: 600; letter-spacing: 2px; }
      .header-btn { fill: #808080; stroke: #404040; stroke-width: 1.5; cursor: pointer; }
      .toolbar-box { fill: #80c0ff; stroke: #3080d0; stroke-width: 1.5; }
      .stats-text { font-family: sans-serif; font-size: 17px; fill: #000000; line-height: 1.4; }
      .chart-spoke { stroke: #999999; stroke-width: 4; stroke-linecap: round; }
      .chart-grid { stroke: #b8b8b8; stroke-width: 1.2; fill: none; }
      .chart-data-line { stroke: #ffffff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .chart-marker { fill: #ffffff; stroke: #ffffff; stroke-width: 2; }
      .chart-label { font-family: sans-serif; font-size: 13px; fill: #666666; font-weight: 500; }
    </style>
  </defs>

  <!-- Outer Background Container -->
  <rect x="0" y="0" width="938.4519" height="581.73077" fill="#ffffff" rx="8" ry="8"/>

  <!-- Main Floating Widget Window -->
  <g id="stats_window" transform="translate(140, 20)">
    <!-- Window Outer Frame -->
    <rect class="window-frame" x="0" y="0" width="658" height="540" rx="4" ry="4" />
    
    <!-- Window Top Header Bar -->
    <rect class="window-header" x="0" y="0" width="658" height="38" rx="4" ry="4" />

    <!-- Window Title -->
    <text x="329" y="26" class="header-title" text-anchor="middle">STATS</text>

    <!-- Header Action Buttons (Close, Maximize, Minimize) -->
    <!-- Close Button (Left side of header) -->
    <rect class="header-btn" x="8" y="7" width="24" height="24" rx="2" />
    <path d="M 13,12 L 27,26 M 27,12 L 13,26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Maximize Button (Right side of header) -->
    <rect class="header-btn" x="592" y="7" width="24" height="24" rx="2" />
    <path d="M 596,11 H 612 V 27 H 596 Z M 600,15 H 608 V 23 H 600 Z" fill="#ffffff" />

    <!-- Minimize Button (Right side of header) -->
    <rect class="header-btn" x="622" y="7" width="24" height="24" rx="2" />
    <rect x="626" y="21" width="16" height="4" fill="#ffffff" />

    <!-- Window Body Area -->
    <g transform="translate(0, 38)">
      
      <!-- Toolbar Button Area (Refresh Button reload.svg) -->
      <g transform="translate(10, 10)">
        <rect class="toolbar-box" x="0" y="0" width="48" height="48" rx="4" />
        <!-- Refresh Icon reload.svg -->
        <g transform="translate(10, 10) scale(1.4)">
          <path d="M 10,2 A 8,8 0 1,1 3.5,6" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" />
          <polygon points="10,0 10,6 15,2" fill="#000000" />
        </g>
      </g>

      <!-- Statistical Data Text List -->
      <g transform="translate(80, 20)">
        <text class="stats-text" x="0" y="20">• duples: 0</text>
        <text class="stats-text" x="0" y="44">• triplets: 0</text>
        <text class="stats-text" x="0" y="68">• quintuplets: 0</text>
        <text class="stats-text" x="0" y="92">• pitch names: G</text>
        <text class="stats-text" x="0" y="116">• number of notes: 1</text>
        <text class="stats-text" x="0" y="140">• lowest note: G4, 392Hz</text>
        <text class="stats-text" x="0" y="164">• highest note: G4, 392Hz</text>
        <text class="stats-text" x="0" y="188">• rests used: 0</text>
        <text class="stats-text" x="0" y="212">• ornaments used: 0</text>
      </g>

      <!-- 2D Radar Chart Visualization (Matching Widget Output) -->
      <g transform="translate(420, 240)">
        <!-- Outer Concentric Polygon Rings (11-gon) -->
        <polygon class="chart-grid" points="0,-100 54.1,-84.1 91.0,-41.5 99.0,14.2 75.6,65.5 28.2,95.9 -28.2,95.9 -75.6,65.5 -99.0,14.2 -91.0,-41.5 -54.1,-84.1" />
        <polygon class="chart-grid" points="0,-75 40.5,-63.1 68.2,-31.1 74.2,10.7 56.7,49.1 21.1,71.9 -21.1,71.9 -56.7,49.1 -74.2,10.7 -68.2,-31.1 -40.5,-63.1" />
        <polygon class="chart-grid" points="0,-50 27.0,-42.1 45.5,-20.8 49.5,7.1 37.8,32.7 14.1,48.0 -14.1,48.0 -37.8,32.7 -49.5,7.1 -45.5,-20.8 -27.0,-42.1" />
        <polygon class="chart-grid" points="0,-25 13.5,-21.0 22.7,-10.4 24.7,3.6 18.9,16.4 7.0,24.0 -7.0,24.0 -18.9,16.4 -24.7,3.6 -22.7,-10.4 -13.5,-21.0" />

        <!-- 11 Thick Radial Spokes -->
        <line class="chart-spoke" x1="0" y1="0" x2="0" y2="-100" />
        <line class="chart-spoke" x1="0" y1="0" x2="54.1" y2="-84.1" />
        <line class="chart-spoke" x1="0" y1="0" x2="91.0" y2="-41.5" />
        <line class="chart-spoke" x1="0" y1="0" x2="99.0" y2="14.2" />
        <line class="chart-spoke" x1="0" y1="0" x2="75.6" y2="65.5" />
        <line class="chart-spoke" x1="0" y1="0" x2="28.2" y2="95.9" />
        <line class="chart-spoke" x1="0" y1="0" x2="-28.2" y2="95.9" />
        <line class="chart-spoke" x1="0" y1="0" x2="-75.6" y2="65.5" />
        <line class="chart-spoke" x1="0" y1="0" x2="-99.0" y2="14.2" />
        <line class="chart-spoke" x1="0" y1="0" x2="-91.0" y2="-41.5" />
        <line class="chart-spoke" x1="0" y1="0" x2="-54.1" y2="-84.1" />

        <!-- Data Value Line & Markers (Single Pitch Value active) -->
        <line class="chart-data-line" x1="0" y1="0" x2="40.5" y2="-63.1" />
        <circle class="chart-marker" cx="0" cy="0" r="9" />
        <circle class="chart-marker" cx="40.5" cy="-63.1" r="9" />
        <circle cx="40.5" cy="-63.1" r="5" fill="#999999" />

        <!-- 11 Axis Labels (matching PALLABELS) -->
        <text class="chart-label" text-anchor="middle" x="0" y="-115">rhythm</text>
        <text class="chart-label" text-anchor="start" x="64" y="-95">pitch</text>
        <text class="chart-label" text-anchor="start" x="104" y="-45">tone</text>
        <text class="chart-label" text-anchor="start" x="112" y="18">mouse</text>
        <text class="chart-label" text-anchor="start" x="86" y="75">pen</text>
        <text class="chart-label" text-anchor="middle" x="32" y="115">number</text>
        <text class="chart-label" text-anchor="middle" x="-32" y="115">flow</text>
        <text class="chart-label" text-anchor="end" x="-86" y="75">action</text>
        <text class="chart-label" text-anchor="end" x="-112" y="18">sensors</text>
        <text class="chart-label" text-anchor="end" x="-104" y="-45">media</text>
        <text class="chart-label" text-anchor="end" x="-64" y="-95">mice</text>
      </g>
    </g>
  </g>
</svg>
