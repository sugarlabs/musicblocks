# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

tone_instructions: "Music Blocks is a Sugar Labs project used by students learning to code through music; many contributors are newcomers. Be encouraging, explain the why, and skip nitpicks ESLint already flags."

reviews:
  profile: "chill"                 # balanced feedback, not nitpicky
  request_changes_workflow: false  # comment-only, never blocks a merge
  high_level_summary: true
  poem: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    base_branches: ["master"]
    ignore_title_keywords:
      - "wip"
      - "draft"

  path_filters:
    - "!dist/**"
    - "!build/**"
    - "!node_modules/**"
    - "!**/*.min.js"

  path_instructions:
    - path: "js/**/*.js"
      instructions: |
        Core runtime code (block execution, turtle graphics, synth playback).
        Flag likely race conditions around async Tone.js/audio calls and
        rapid project-switch or play/stop sequences — this codebase has
        shipped real crashes from exactly that pattern. Confirm added event
        listeners are removed (removeEventListener/dispose) to avoid leaks.

    - path: "**/*.test.js"
      instructions: |
        Confirm the test actually asserts behavior rather than just invoking
        a function. Call out missing edge cases (empty state, rapid
        re-triggering, cross-browser listener fallbacks) ahead of style nits.

    - path: "js/project-manager.js"
      instructions: |
        Handles serialization/export and holds state shared across the app.
        Flag any function that mutates module-level or singleton state
        directly instead of working on a local copy — this has caused bugs
        here before.

    - path: ".github/workflows/**"
      instructions: |
        CI/workflow changes. Check regex and shell patterns for
        platform-specific edge cases (e.g. CRLF vs LF line endings) before
        approving.

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: "Concise and descriptive, matching the current PR template's format."
    description:
      mode: "warning"

  tools:
    eslint:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true
  art: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "REVIEW_GUIDELINES.md"
      