name: CI

# Unified CI pipeline.
# Consolidates: Smoke Test (build), ESLint & Prettier (lint),
# Jest Tests, Cypress E2E, and Security Scans into a single workflow,
# plus commit-message linting (commitlint).
#
# Trigger note: uses `pull_request` (NOT pull_request_target) so untrusted
# fork code is never executed with repository secrets or a write-scoped token.
# See the Codecov note in ci.yml's `test` job re: fork PRs.

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

# One in-flight run per PR / ref; newer pushes cancel older runs.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# Least privilege by default; individual jobs do not need more.
permissions:
    contents: read

jobs:
    # ----------------------------------------------------------------------
    # Commit message linting (conventional commits)
    # ----------------------------------------------------------------------
    commitlint:
        name: Lint commit messages
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint PR commits
              if: github.event_name == 'pull_request'
              run: >-
                  npx commitlint
                  --from ${{ github.event.pull_request.base.sha }}
                  --to ${{ github.event.pull_request.head.sha }}
                  --verbose

            # NOTE: on a squash merge the commit that lands on master is the PR
            # TITLE, not any of the commits linted above. That is checked by
            # pr-title-check.yml, which needs the `edited` trigger this
            # workflow deliberately does not have.

    # ----------------------------------------------------------------------
    # ESLint + Prettier on changed JS files only
    # ----------------------------------------------------------------------
    lint:
        name: Lint & format-check changed JS files
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '22.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Get changed JavaScript files
              id: get_files
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    BASE="${{ github.event.pull_request.base.sha }}"
                    HEAD="${{ github.event.pull_request.head.sha }}"
                  else
                    BASE="${{ github.event.before }}"
                    HEAD="${{ github.sha }}"
                  fi

                  # Guard against the all-zero SHA on first push of a new branch.
                  if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
                    BASE="$(git rev-parse "$HEAD^" 2>/dev/null || echo "$HEAD")"
                  fi

                  git diff --diff-filter=ACMRT --name-only "$BASE" "$HEAD" \
                    -- '*.js' '*.mjs' ':!node_modules/**' > changed-js-files.txt || true

                  if [ -s changed-js-files.txt ]; then
                    echo "has_files=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_files=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Run ESLint on changed files
              if: steps.get_files.outputs.has_files == 'true'
              run: |
                  echo "Linting the following files:"
                  cat changed-js-files.txt
                  xargs -r npx eslint < changed-js-files.txt

            - name: Run Prettier check on changed files
              if: steps.get_files.outputs.has_files == 'true'
              run: |
                  echo "Checking formatting for the following files:"
                  cat changed-js-files.txt
                  xargs -r npx prettier --check < changed-js-files.txt

    # ----------------------------------------------------------------------
    # Build / smoke test across Node versions
    # ----------------------------------------------------------------------
    build:
        name: Build (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                node-version: [20.x, 22.x]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build --if-present

    # ----------------------------------------------------------------------
    # Jest unit tests + coverage + Codecov upload
    # ----------------------------------------------------------------------
    test:
        name: Jest tests & coverage
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Generates coverage/coverage-summary.json, used by the coverage-delta
            # job below to enforce no regression vs. the base branch. This step
            # itself no longer enforces a static coverage threshold.
            - name: Run Jest with coverage
              run: npm test -- --coverage --ci
               
            # Coverage regressions are enforced by the coverage-delta job below,
            # which compares this run's coverage-summary.json against the base
            # branch's instead of a static threshold. Share the summary so that
            # job doesn't need to re-run Jest against the PR head a second time.
            - name: Upload PR coverage summary
              uses: actions/upload-artifact@v4
              with:
                  name: pr-coverage-summary
                  path: coverage/coverage-summary.json
                  retention-days: 1

            # Upload to Codecov for the PR-vs-base coverage diff + status check.
            # NOTE: secrets (CODECOV_TOKEN) are NOT available to pull_request runs
            # originating from forks. so this upload is skipped on forks (only the
            # coverage-delta job's check still runs there). fail_ci_if_error
            # is false so a flaky/absent upload never blocks the PR.
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  fail_ci_if_error: false
                  verbose: true

    # ----------------------------------------------------------------------
    # Coverage delta: fail if this PR's coverage is lower than the base
    # branch's, instead of a static jest.config.js threshold that needs
    # manual bumps as coverage improves.
    #
    # Reuses the "test" job's coverage-summary.json for the PR head (no
    # second Jest run there). The base branch's coverage-summary.json is
    # cached by base commit SHA, so this only costs an extra Jest run the
    # first time a given base commit (e.g. a master merge) is seen — every
    # other PR built on top of that same commit hits the cache.
    # ----------------------------------------------------------------------
    coverage-delta:
        name: Coverage delta vs base
        needs: test
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout PR head
              uses: actions/checkout@v4
              with:
                  # Full history: the cache-miss step below needs to be able to
                  # `git worktree add` the base branch's commit, not just HEAD.
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Download PR coverage summary
              uses: actions/download-artifact@v4
              with:
                  name: pr-coverage-summary
                  path: pr-coverage

            - name: Restore cached base-branch coverage
              id: cache-base
              uses: actions/cache@v4
              with:
                  path: base-coverage/coverage-summary.json
                  key: coverage-base-${{ github.event.pull_request.base.sha }}

            - name: Compute base-branch coverage (cache miss)
              if: steps.cache-base.outputs.cache-hit != 'true'
              run: |
                  git worktree add /tmp/base-checkout ${{ github.event.pull_request.base.sha }}
                  cd /tmp/base-checkout
                  npm ci
                  npx jest --coverage --ci
                  mkdir -p "$GITHUB_WORKSPACE/base-coverage"
                  cp coverage/coverage-summary.json "$GITHUB_WORKSPACE/base-coverage/coverage-summary.json"

            - name: Compare PR coverage against base
              run: >-
                  node .github/scripts/compare-coverage.js
                  base-coverage/coverage-summary.json
                  pr-coverage/coverage-summary.json

    # ----------------------------------------------------------------------
    # Cypress end-to-end tests
    # ----------------------------------------------------------------------
    e2e:
        name: Cypress E2E
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Run Cypress E2E tests
              uses: cypress-io/github-action@v6
              with:
                  install-command: npm ci
                  start: npm start
                  wait-on: 'http://127.0.0.1:3000'
                  wait-on-timeout: 120
                  browser: chrome
                  config: video=false

            - name: Upload Cypress screenshots on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: cypress-screenshots
                  path: cypress/screenshots
                  if-no-files-found: ignore

    # ----------------------------------------------------------------------
    # Dependency security audit
    # (Branch trigger fixed to `master` here — the standalone file's `main`
    #  trigger no longer applies once this job replaces it.)
    # ----------------------------------------------------------------------
    security:
        name: Security audit
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '22'

            - name: Run npm audit
              run: npm audit --omit=dev --audit-level=high