name: Coverage delta

# Compares Jest statement/branch/function/line coverage between the PR branch
# and the base branch. The job fails (and prints a clear report) when any
# metric regresses. Never runs on direct pushes to master or on Renovate bot PRs.
#
# Three-job design for isolation:
#   measure-base  -- runs in a fresh VM; uploads base summary as an artifact
#   measure-pr    -- runs in a fresh VM; uploads PR summary as an artifact
#   compare       -- downloads both artifacts; compares the four metrics
#
# Because each job gets its own runner, PR code (npm ci / jest in measure-pr)
# is never co-located with the base summary file, and lifecycle scripts in the
# PR cannot overwrite it.

on:
    pull_request:
        branches: [master]

concurrency:
    group: coverage-delta-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # ── Job 1: measure coverage on the BASE branch ────────────────────────────
    measure-base:
        name: Coverage – base branch
        runs-on: ubuntu-latest
        if: github.actor != 'renovate[bot]'
        timeout-minutes: 30
        steps:
            - name: Checkout base branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci
              shell: bash

            - name: Run Jest with coverage
              run: |
                  npx jest --coverage --coverageReporters=json-summary --ci \
                      --passWithNoTests
              shell: bash

            - name: Upload base coverage summary
              uses: actions/upload-artifact@v4
              with:
                  name: base-coverage-summary
                  path: coverage/coverage-summary.json
                  retention-days: 1

    # ── Job 2: measure coverage on the PR HEAD ────────────────────────────────
    measure-pr:
        name: Coverage – PR head
        runs-on: ubuntu-latest
        if: github.actor != 'renovate[bot]'
        timeout-minutes: 30
        steps:
            - name: Checkout PR head
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci
              shell: bash

            - name: Run Jest with coverage
              run: |
                  npx jest --coverage --coverageReporters=json-summary --ci \
                      --passWithNoTests
              shell: bash

            - name: Upload PR coverage summary
              uses: actions/upload-artifact@v4
              with:
                  name: pr-coverage-summary
                  path: coverage/coverage-summary.json
                  retention-days: 1

    # ── Job 3: compare the two summaries ─────────────────────────────────────
    compare:
        name: Coverage delta vs base
        runs-on: ubuntu-latest
        needs: [measure-base, measure-pr]
        if: github.actor != 'renovate[bot]'
        timeout-minutes: 5
        steps:
            - name: Download base coverage summary
              uses: actions/download-artifact@v4
              with:
                  name: base-coverage-summary
                  path: base

            - name: Download PR coverage summary
              uses: actions/download-artifact@v4
              with:
                  name: pr-coverage-summary
                  path: pr

            - name: Compare coverage metrics
              run: |
                  node - <<'EOF'
                  const fs = require("fs");

                  const base = JSON.parse(fs.readFileSync("base/coverage-summary.json")).total;
                  const pr   = JSON.parse(fs.readFileSync("pr/coverage-summary.json")).total;

                  const metrics = ["statements", "branches", "functions", "lines"];
                  let failed = false;

                  console.log("\nCoverage delta report");
                  console.log("-".repeat(52));
                  console.log(
                      "Metric".padEnd(14),
                      "Base %".padStart(8),
                      "PR %".padStart(8),
                      "Delta".padStart(8)
                  );
                  console.log("-".repeat(52));

                  for (const m of metrics) {
                      const basePct = base[m].pct;
                      const prPct   = pr[m].pct;
                      const delta   = (prPct - basePct).toFixed(2);
                      const sign    = delta >= 0 ? "+" : "";
                      const flag    = prPct < basePct ? " <- DROPPED" : "";

                      console.log(
                          m.padEnd(14),
                          String(basePct).padStart(8),
                          String(prPct).padStart(8),
                          (sign + delta + "%").padStart(8) + flag
                      );

                      if (prPct < basePct) failed = true;
                  }

                  console.log("-".repeat(52));

                  if (failed) {
                      console.error(
                          "\nOne or more coverage metrics dropped compared to the base branch." +
                          "\nPlease add tests to cover the new code, or adjust the PR so" +
                          "\ncoverage does not regress."
                      );
                      process.exit(1);
                  }

                  console.log("\nAll coverage metrics are stable or improved.");
                  EOF
              shell: bash
