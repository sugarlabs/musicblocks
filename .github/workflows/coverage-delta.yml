name: Coverage delta

# Compares Jest statement/branch/function/line coverage between the PR branch
# and the base branch. The job fails (and prints a clear report) when any
# metric regresses. Never runs on direct pushes to master or on Renovate bot PRs.
#
# How it works:
#   1. Check out the base SHA into ./base-checkout/, run Jest, save summary.
#   2. Check out the PR head SHA into ./pr-checkout/, run Jest, save summary.
#   3. A small inline Node script reads both files and exits non-zero if any
#      of the four standard metrics has gone down.
#
# Each checkout is fully isolated in its own directory so no source or test
# files from one run ever affect the other.

on:
    pull_request:
        branches: [master]

# Cancel any in-flight run for the same PR when a new commit is pushed.
concurrency:
    group: coverage-delta-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    coverage-delta:
        name: Coverage delta vs base
        runs-on: ubuntu-latest
        # Check the actual bot actor, not the branch name.
        # Renovate bumps only update package versions; they never delete tests.
        if: github.actor != 'renovate[bot]'
        timeout-minutes: 30

        steps:
            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "22"

            # ── Step 1: coverage on the BASE branch ──────────────────────────
            - name: Checkout base branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  # Do not persist the job token; PR code must not be able to
                  # read it when npm ci / jest runs against the base.
                  persist-credentials: false
                  path: base-checkout

            - name: Run Jest on base branch
              working-directory: base-checkout
              run: |
                  npm ci --silent
                  rm -rf coverage
                  npx jest --coverage --coverageReporters=json-summary --ci \
                      --passWithNoTests
                  cp coverage/coverage-summary.json /tmp/base-coverage.json
              shell: bash

            # ── Step 2: coverage on the PR HEAD ──────────────────────────────
            - name: Checkout PR head
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false
                  path: pr-checkout

            - name: Run Jest on PR head
              working-directory: pr-checkout
              run: |
                  npm ci --silent
                  rm -rf coverage
                  npx jest --coverage --coverageReporters=json-summary --ci \
                      --passWithNoTests
                  cp coverage/coverage-summary.json /tmp/pr-coverage.json
              shell: bash

            # ── Step 3: compare and fail on any regression ───────────────────
            - name: Compare coverage metrics
              run: |
                  node - <<'EOF'
                  const fs = require("fs");

                  const base = JSON.parse(fs.readFileSync("/tmp/base-coverage.json")).total;
                  const pr   = JSON.parse(fs.readFileSync("/tmp/pr-coverage.json")).total;

                  const metrics = ["statements", "branches", "functions", "lines"];
                  let failed = false;

                  console.log("\nCoverage delta report");
                  console.log("-".repeat(52));
                  console.log(
                      "Metric".padEnd(14),
                      "Base %".padStart(8),
                      "PR %".padStart(8),
                      "Delta".padStart(8)
                  );
                  console.log("-".repeat(52));

                  for (const m of metrics) {
                      const basePct = base[m].pct;
                      const prPct   = pr[m].pct;
                      const delta   = (prPct - basePct).toFixed(2);
                      const sign    = delta >= 0 ? "+" : "";
                      const flag    = prPct < basePct ? " <- DROPPED" : "";

                      console.log(
                          m.padEnd(14),
                          String(basePct).padStart(8),
                          String(prPct).padStart(8),
                          (sign + delta + "%").padStart(8) + flag
                      );

                      if (prPct < basePct) failed = true;
                  }

                  console.log("-".repeat(52));

                  if (failed) {
                      console.error(
                          "\nOne or more coverage metrics dropped compared to the base branch." +
                          "\nPlease add tests to cover the new code, or adjust the PR so" +
                          "\ncoverage does not regress."
                      );
                      process.exit(1);
                  }

                  console.log("\nAll coverage metrics are stable or improved.");
                  EOF
              shell: bash
