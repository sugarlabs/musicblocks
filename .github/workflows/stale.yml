name: Close Stale Pull Requests

on:
    schedule:
        - cron: "30 19 * * *"
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write
    issues: write

concurrency:
    group: stale-pull-requests
    cancel-in-progress: false

jobs:
    stale:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Process stale pull requests
              uses: actions/github-script@v7
              with:
                  script: |
                      const STALE_DAYS = 60;
                      const CLOSE_DAYS = 3;
                      const MAX_OPERATIONS = 150;
                      const STALE_LABEL = "stale";
                      const WORKFLOW_ACTOR = "github-actions[bot]";
                      const PUSH_TRACKING_START = Date.parse("2026-10-29T00:00:00Z");
                      const STALE_MS = STALE_DAYS * 86400000;
                      const CLOSE_MS = CLOSE_DAYS * 86400000;
                      const STALE_MESSAGE =
                        `This PR has had no qualifying human activity for ${STALE_DAYS} days. ` +
                        `A human code push or moving it from Draft to Ready for Review resets the clock. ` +
                        `It will be closed after ${CLOSE_DAYS} additional days without new activity.`;

                      function parseTime(value) {
                        if (typeof value !== "string" || value.length === 0) return null;
                        const time = Date.parse(value);
                        return Number.isFinite(time) ? time : null;
                      }

                      function activityTime(record, createdAt) {
                        const recorded = parseTime(record && record.pushedAt);
                        if (recorded !== null) return recorded;
                        return parseTime(createdAt);
                      }

                      function hasUnresolvedHistoricalActivity(record, createdAt) {
                        const created = parseTime(createdAt);
                        return (
                          created !== null &&
                          created < PUSH_TRACKING_START &&
                          parseTime(record && record.pushedAt) === null
                        );
                      }

                      function isBotAuthor(pr) {
                        const user = pr && pr.user;
                        const login = user && typeof user.login === "string" ? user.login : "";
                        const type = user && typeof user.type === "string" ? user.type : "";
                        return type.toLowerCase() === "bot" || login.toLowerCase().endsWith("[bot]");
                      }

                      function findLabel(labels, labelName) {
                        if (!Array.isArray(labels)) return false;
                        return labels.find(
                          label =>
                            label &&
                            typeof label.name === "string" &&
                            label.name.toLowerCase() === labelName.toLowerCase()
                        );
                      }

                      function hasLabel(labels, labelName) {
                        return Boolean(findLabel(labels, labelName));
                      }

                      function latestStaleLabelTime(events) {
                        if (!Array.isArray(events)) return null;
                        for (let i = events.length - 1; i >= 0; i--) {
                          const event = events[i];
                          if (
                            event &&
                            event.event === "labeled" &&
                            event.label &&
                            typeof event.label.name === "string" &&
                            event.label.name.toLowerCase() === STALE_LABEL.toLowerCase()
                          ) {
                            return parseTime(event.created_at);
                          }
                        }
                        return null;
                      }

                      function decideStaleAction(input) {
                        const now = input && input.now;
                        const lastPush = input && input.lastPush;
                        const hasStaleLabel = input && input.hasStaleLabel;
                        const staleSince = input && input.staleSince;
                        if (input && input.historicalActivityUnknown) return "skip";
                        if (!Number.isFinite(now) || !Number.isFinite(lastPush)) return "skip";

                        if (hasStaleLabel) {
                          if (!Number.isFinite(staleSince)) return "skip";
                          if (lastPush > staleSince || now - lastPush < STALE_MS) return "remove-label";
                          if (now - staleSince < CLOSE_MS) return "grace";
                          return "close";
                        }

                        if (now - lastPush >= STALE_MS) return "label";
                        return "fresh";
                      }

                      function decodeState(data) {
                        if (!data || Array.isArray(data) || typeof data.content !== "string") {
                          throw new Error("Activity state file is missing or is not a file.");
                        }
                        let parsed;
                        try {
                          parsed = JSON.parse(Buffer.from(data.content, "base64").toString("utf8"));
                        } catch (err) {
                          throw new Error("Activity state file is not valid JSON.");
                        }
                        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
                          throw new Error("Activity state file is not a JSON object.");
                        }
                        return parsed;
                      }

                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      let operations = 0;

                      async function mutate(description, fn) {
                        if (operations >= MAX_OPERATIONS) {
                          core.warning(`Operation limit reached: ${description}`);
                          return false;
                        }
                        await fn();
                        operations++;
                        core.info(description);
                        return true;
                      }

                      async function loadState() {
                        try {
                          const response = await github.rest.repos.getContent({
                            owner,
                            repo,
                            path: "pr-push-state.json",
                            ref: "automation/pr-push-state"
                          });
                          return decodeState(response.data);
                        } catch (err) {
                          if (err.status === 404) return {};
                          throw err;
                        }
                      }

                      async function getStaleLabelTime(prNumber) {
                        const events = await github.paginate(
                          github.rest.issues.listEventsForTimeline,
                          {
                            owner,
                            repo,
                            issue_number: prNumber,
                            per_page: 100
                          }
                        );
                        return latestStaleLabelTime(events);
                      }

                      async function getStaleWarningComment(prNumber, staleSince) {
                        const comments = await github.paginate(
                          github.rest.issues.listComments,
                          {
                            owner,
                            repo,
                            issue_number: prNumber,
                            per_page: 100
                          }
                        );
                        for (let i = comments.length - 1; i >= 0; i--) {
                          const comment = comments[i];
                          if (!comment || typeof comment.body !== "string") continue;
                          if (
                            !comment.user ||
                            comment.user.login !== WORKFLOW_ACTOR
                          ) {
                            continue;
                          }
                          if (!comment.body.includes(STALE_MESSAGE)) continue;
                          const createdAt = parseTime(comment.created_at);
                          if (
                            Number.isFinite(staleSince) &&
                            createdAt !== null &&
                            createdAt >= staleSince
                          ) {
                            return createdAt;
                          }
                        }
                        return null;
                      }

                      async function addStaleWarning(prNumber, staleSince) {
                        const warningSince = await getStaleWarningComment(prNumber, staleSince);
                        if (warningSince !== null) {
                          core.info(
                            `Stale warning comment already exists on PR #${prNumber}; skipping comment.`
                          );
                          return true;
                        }
                        return mutate(`Adding stale notice to PR #${prNumber}`, async () => {
                          await github.rest.issues.createComment({
                            owner,
                            repo,
                            issue_number: prNumber,
                            body: STALE_MESSAGE
                          });
                        });
                      }

                      async function hasClosureComment(prNumber) {
                        const comments = await github.paginate(
                          github.rest.issues.listComments,
                          {
                            owner,
                            repo,
                            issue_number: prNumber,
                            per_page: 100
                          }
                        );
                        return comments.some(
                          comment =>
                            comment &&
                            comment.user &&
                            comment.user.login === WORKFLOW_ACTOR &&
                            comment.body ===
                              "Closed due to inactivity after the stale grace period."
                        );
                      }

                      async function confirmedDecision(pr, staleSince) {
                        let currentPR;
                        try {
                          const response = await github.rest.pulls.get({
                            owner,
                            repo,
                            pull_number: pr.number
                          });
                          currentPR = response.data;
                        } catch (err) {
                          core.warning(`Could not fetch PR #${pr.number}: ${err.message}`);
                          return "skip";
                        }

                        if (!currentPR || currentPR.state !== "open") {
                          core.info(`Skipping PR #${pr.number}; it is no longer open.`);
                          return "skip";
                        }

                        if (isBotAuthor(currentPR)) {
                          core.info(`Skipping bot-authored PR #${pr.number}.`);
                          return "skip";
                        }

                        if (currentPR && currentPR.draft) {
                          core.info(`Skipping draft PR #${pr.number}.`);
                          return "draft";
                        }

                        const refreshedHasStaleLabel = hasLabel(
                          currentPR && currentPR.labels,
                          STALE_LABEL
                        );
                        let latestState;
                        try {
                          latestState = await loadState();
                        } catch (err) {
                          core.setFailed(`Could not load push state: ${err.message}`);
                          return "stop";
                        }
                        const latestPush = activityTime(
                          latestState[String(pr.number)],
                          pr.created_at
                        );
                        const historicalActivityUnknown = hasUnresolvedHistoricalActivity(
                          latestState[String(pr.number)],
                          currentPR.created_at
                        );
                        if (historicalActivityUnknown) {
                          core.info(
                            `Skipping PR #${pr.number}; historical push activity is unresolved.`
                          );
                          return "skip";
                        }
                        return decideStaleAction({
                          now: Date.now(),
                          lastPush: latestPush,
                          hasStaleLabel: refreshedHasStaleLabel,
                          staleSince: refreshedHasStaleLabel ? staleSince : null,
                          historicalActivityUnknown
                        });
                      }

                      async function removeDraftStaleLabel(pr) {
                        const staleLabel = findLabel(pr.labels, STALE_LABEL);
                        if (!staleLabel) return;
                        let latestState;
                        try {
                          latestState = await loadState();
                        } catch (err) {
                          core.warning(
                            `Could not load push state while checking draft PR #${pr.number}: ${err.message}`
                          );
                          return;
                        }
                        const pushedAt = parseTime(
                          latestState[String(pr.number)] && latestState[String(pr.number)].pushedAt
                        );
                        const staleSince = await getStaleLabelTime(pr.number);
                        if (
                          pushedAt === null ||
                          staleSince === null ||
                          pushedAt <= staleSince
                        ) {
                          return;
                        }
                        await mutate(`Removing stale label from draft PR #${pr.number}`, async () => {
                          await github.rest.issues.removeLabel({
                            owner,
                            repo,
                            issue_number: pr.number,
                            name: staleLabel.name
                          });
                        });
                      }

                      async function processPR(pr, state) {
                        if (isBotAuthor(pr)) {
                          core.info(`Skipping bot-authored PR #${pr.number}.`);
                          return;
                        }
                        if (pr.draft) {
                          await removeDraftStaleLabel(pr);
                          core.info(`Skipping draft PR #${pr.number}.`);
                          return;
                        }

                        const record = state[String(pr.number)];
                        const lastPush = activityTime(record, pr.created_at);
                        const historicalActivityUnknown = hasUnresolvedHistoricalActivity(
                          record,
                          pr.created_at
                        );
                        if (historicalActivityUnknown) {
                          core.info(
                            `Skipping PR #${pr.number}; historical push activity is unresolved.`
                          );
                          return;
                        }
                        const hasStaleLabel = hasLabel(pr.labels, STALE_LABEL);
                        const staleSince = hasStaleLabel ? await getStaleLabelTime(pr.number) : null;
                        const warningSince = hasStaleLabel
                          ? await getStaleWarningComment(pr.number, staleSince)
                          : null;
                        const decision = decideStaleAction({
                          now: Date.now(),
                          lastPush,
                          hasStaleLabel,
                          staleSince: warningSince || staleSince,
                          historicalActivityUnknown
                        });

                        if (decision === "skip") {
                          core.warning(
                            `Skipping PR #${pr.number}; activity or stale label time is unavailable.`
                          );
                          return;
                        }
                        if (decision === "fresh") return;

                        if (decision === "remove-label") {
                          const latestDecision = await confirmedDecision(pr, staleSince);
                          if (latestDecision === "stop") return "stop";
                          if (latestDecision === "draft") return;
                          if (latestDecision !== "remove-label") {
                            core.info(
                              `PR #${pr.number} state changed; not removing stale label.`
                            );
                            return;
                          }
                          const staleLabel = findLabel(pr.labels, STALE_LABEL);
                          if (!staleLabel) {
                            core.info(`Stale label is no longer present on PR #${pr.number}.`);
                            return;
                          }
                          await mutate(`Removing stale label from PR #${pr.number}`, async () => {
                            await github.rest.issues.removeLabel({
                              owner,
                              repo,
                              issue_number: pr.number,
                              name: staleLabel.name
                            });
                          });
                          return;
                        }

                        if (decision === "grace") {
                          if (warningSince === null) {
                            const latestDecision = await confirmedDecision(pr, staleSince);
                            if (latestDecision === "stop") return "stop";
                            if (
                              latestDecision === "grace" ||
                              latestDecision === "close"
                            ) {
                              await addStaleWarning(pr.number, staleSince);
                            }
                          }
                          core.info(`PR #${pr.number} is in its grace period.`);
                          return;
                        }

                        if (decision === "label") {
                          const latestDecision = await confirmedDecision(pr, null);
                          if (latestDecision === "stop") return "stop";
                          if (latestDecision === "draft") return;
                          if (latestDecision === "skip") return;
                          if (latestDecision !== "label") {
                            core.info(`PR #${pr.number} received newer human activity; not labeling.`);
                            return;
                          }

                          if (operations > MAX_OPERATIONS - 2) {
                            core.warning(
                              `Operation limit reached before labeling PR #${pr.number}.`
                            );
                            return;
                          }

                          const labeled = await mutate(
                            `Adding stale label to PR #${pr.number}`,
                            async () => {
                              await github.rest.issues.addLabels({
                                owner,
                                repo,
                                issue_number: pr.number,
                                labels: [STALE_LABEL]
                              });
                            }
                          );
                          if (!labeled) return;

                          const staleSince = await getStaleLabelTime(pr.number);
                          if (!Number.isFinite(staleSince)) {
                            core.warning(
                              `Could not find the new stale label event for PR #${pr.number}; ` +
                                "skipping stale warning comment."
                            );
                            return;
                          }

                          await addStaleWarning(pr.number, staleSince);
                          return;
                        }

                        if (warningSince === null) {
                          const latestDecision = await confirmedDecision(pr, staleSince);
                          if (latestDecision === "stop") return "stop";
                          if (latestDecision === "draft") return;
                          if (latestDecision === "skip") return;
                          if (
                            latestDecision === "grace" ||
                            latestDecision === "close"
                          ) {
                            await addStaleWarning(pr.number, staleSince);
                          }
                          return;
                        }

                        const currentStaleSince = await getStaleLabelTime(pr.number);
                        if (
                          !Number.isFinite(currentStaleSince) ||
                          currentStaleSince !== staleSince
                        ) {
                          core.info(
                            `Skipping closure for PR #${pr.number}; stale-label cycle changed.`
                          );
                          return;
                        }
                        const currentWarningSince = await getStaleWarningComment(
                          pr.number,
                          currentStaleSince
                        );
                        if (currentWarningSince === null) {
                          core.info(
                            `Skipping closure for PR #${pr.number}; current-cycle warning is unavailable.`
                          );
                          return;
                        }
                        const latestDecision = await confirmedDecision(
                          pr,
                          currentWarningSince
                        );
                        if (latestDecision === "stop") return "stop";
                        if (latestDecision === "draft") return;
                        if (latestDecision === "skip") return;
                        if (latestDecision !== "close") {
                          core.info(`PR #${pr.number} received newer human activity; not closing.`);
                          return;
                        }

                        const closureCommentExists = await hasClosureComment(pr.number);
                        if (!closureCommentExists && operations > MAX_OPERATIONS - 2) {
                          core.warning(
                            `Operation limit reached before closing PR #${pr.number}.`
                          );
                          return;
                        }

                        if (!closureCommentExists) {
                          const commentAdded = await mutate(
                            `Adding closure comment to PR #${pr.number}`,
                            async () => {
                              await github.rest.issues.createComment({
                                owner,
                                repo,
                                issue_number: pr.number,
                                body: "Closed due to inactivity after the stale grace period."
                              });
                            }
                          );
                          if (!commentAdded) return;
                        }

                        await mutate(`Closing PR #${pr.number}`, async () => {
                          await github.rest.pulls.update({
                            owner,
                            repo,
                            pull_number: pr.number,
                            state: "closed"
                          });
                        });
                      }

                      async function run() {
                        let prs;
                        try {
                          prs = await github.paginate(github.rest.pulls.list, {
                            owner,
                            repo,
                            state: "open",
                            per_page: 100
                          });
                        } catch (error) {
                          core.setFailed(`Failed to fetch open PRs: ${error.message}`);
                          return;
                        }

                        core.info(`Found ${prs.length} open PRs.`);

                        let currentState;
                        try {
                          currentState = await loadState();
                        } catch (err) {
                          core.setFailed(`Could not load push state: ${err.message}`);
                          return;
                        }

                        for (const pr of prs) {
                          if (operations >= MAX_OPERATIONS) {
                            core.warning("Maximum operation limit reached.");
                            break;
                          }
                          try {
                            const result = await processPR(pr, currentState);
                            if (result === "stop") return;
                          } catch (error) {
                            core.error(`Failed to process PR #${pr.number}: ${error.message}`);
                          }
                        }

                        core.info(`Finished. Operations used: ${operations}.`);
                      }

                      await run();
