name: Hidden Payload Scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on code hidden behind long space runs
        run: |
          set +e
          hits=$(grep -rlP ' {200,}\S' \
            --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.ts' \
            --exclude-dir=node_modules .)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Hidden code found behind 200+ spaces in: $hits"
            exit 1
          elif [ "$status" -eq 1 ]; then
            echo "clean: no hidden payload found"
          else
            echo "::error::grep failed to complete the scan (exit $status)"
            exit "$status"
          fi
